<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BrainStorm Quiz-Forgot Password</title>
        <link rel="stylesheet" href="reg.css">
        <!-- Google Font -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">    
    </head>

    <body>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-brain"></i>
                <h2>BrainStorm Quiz</h2>
            </div>

            <button class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Home</a></li>
                <li><a href="" class="home">Forgot-password</a></li>
                <li><a href="../about/about.html">About</a></li>
            </ul>

            <div class="nav-btn">
                <a href="login.html">
                <button class="sign-in">Sign In</button>
                </a>

                <a href="register.html">
                <button class="sign-in">Sign Up</button>
                </a>
            </div>
        </nav>

        <section class="hero">
            <div class="register-container">

                <div class="register-box">

                    <form>

                        <h1>Forgot Password?</h1>

                        <p class="sub-text">
                            Enter your email to reset your password
                        </p>

                        <div class="input-box">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="Enter your email">
                        </div>

                        <div class="input-box">
                            <label>New Password</label>

                            <div class="password-box">
                                <input
                                    type="password"
                                    id="newPassword"
                                    placeholder="Enter new password"
                                >

                                <i class="fa-solid fa-eye toggle-password"></i>
                            </div>
                        </div>

                        <div class="input-box">
                            <label>Confirm Password</label>

                            <div class="password-box">
                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm new password"
                                >

                                <i class="fa-solid fa-eye toggle-password"></i>
                            </div>
                        </div>

                        <button class="register-btn">
                            Reset Password
                        </button>

                        <p class="login-text">
                            Remember your password?
                            <a href="login.html">Sign In</a>
                        </p>
                    </form>
                </div>

                <div class="register-image">
                    <img src="forgot-pass.png" alt="Forgot Password Image">
                </div>
            </div>
        </section>
        <script src="forgott-pass.js"></script>
    </body>
</html>
